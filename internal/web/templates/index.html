<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/static/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<style>
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: var(--card-bg); padding: 28px; border-radius: 10px; width: 85%; max-width: 860px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { margin: 0; font-size: 18px; }
    .close-btn { cursor: pointer; font-size: 24px; color: var(--text-secondary); background: none; border: none; line-height: 1; }
    .modal-actions { display: flex; gap: 8px; }
    .compose-editor { width: 100%; height: 380px; margin-top: 4px; background: #0d1117; color: #e6edf3; border: 1px solid var(--border); padding: 12px; font-family: 'Courier New', monospace; font-size: 13px; border-radius: 6px; resize: vertical; box-sizing: border-box; }
    .btn { padding: 7px 14px; border-radius: 5px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; margin-right: 5px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-danger  { background: var(--danger);  color: white; }
    .btn-info    { background: var(--accent);  color: white; }
    .btn-success { background: #2ea043;         color: white; }
    .btn-warning { background: #d29922;         color: white; }
    .status-tag  { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .st-running  { background: rgba(46,160,67,.2); color: #2ea043; }
    .st-pending  { background: rgba(210,153,34,.2); color: #d29922; }
    .st-dead     { background: rgba(218,54,51,.2);  color: #da3633; }
    .st-starting { background: rgba(88,166,255,.2); color: #58a6ff; }
    .st-manager  { background: rgba(139,148,158,.15); color: #8b949e; }
    .st-worker   { background: rgba(88,166,255,.15); color: #58a6ff; }
    .st-active   { background: rgba(46,160,67,.15);  color: #2ea043; }
    .st-down     { background: rgba(218,54,51,.15);  color: #da3633; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #161b22; color: #e6edf3; padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; z-index: 9999; display: none; }
</style>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo">
                <img src="/static/static/gubernator-icon.png" alt="Gubernator Logo">
                <h1>Gubernator</h1>
                <span class="badge">Manager</span>
            </div>
            <div class="user-info">
                <span id="last-refresh">Refreshing...</span>
            </div>
        </header>

        <main class="dashboard">
            <div class="stats-row" id="stats">
                <!-- Stats injected here -->
            </div>

            <div class="grid">
                <!-- Stacks -->
                <section class="card">
                    <h2>Legions (Stacks)</h2>
                    <div class="table-container">
                        <table id="stacks-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>

                <!-- Nodes -->
                <section class="card">
                    <h2>Centurions (Nodes)</h2>
                    <div class="table-container">
                        <table id="nodes-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>IP</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- Tasks -->
            <section class="card full-width">
                <h2>Cohorts &amp; Tasks (Containers)</h2>
                <div class="table-container">
                    <table id="tasks-table">
                        <thead>
                            <tr>
                                <th>Task ID</th>
                                <th>Service</th>
                                <th>Container</th>
                                <th>Node</th>
                                <th>Status</th>
                                <th>IP</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Compose Editor Modal -->
    <div id="compose-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="compose-modal-title">Stack Compose File</h2>
                <button class="close-btn" onclick="closeComposeModal()">&#x2715;</button>
            </div>
            <textarea id="compose-textarea" class="compose-editor" spellcheck="false"></textarea>
            <div class="modal-actions">
                <button class="btn btn-success" onclick="saveCompose()">Save Changes</button>
                <button class="btn btn-warning" onclick="redeployStack()">Save &amp; Redeploy</button>
                <button class="btn btn-info" onclick="resetCompose()">Reset</button>
            </div>
        </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <script src="/static/static/app.js"></script>
</body>
</html>
