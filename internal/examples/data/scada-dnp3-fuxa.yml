version: "3.8"

# =============================================================================
# Gubernator (gbnt) - Industrial IoT & SCADA Simulation Suite (DNP3 / IEEE 1815)
# Substation Alpha 25 kV + Solar PV Farm Beta 3 MW + DNP3 Master + FUXA HMI
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Eclipse Mosquitto MQTT Telemetry Broker
  # ─────────────────────────────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /var/contenedores/scada-dnp3/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    labels:
      - "ingress.host=mqtt.scada.gbnt.local"
      - "gbnt.service.name=mqtt-broker"
      - "gbnt.service.description=Eclipse Mosquitto MQTT Broker for Industrial Telemetry"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      placement:
        constraints:
          - stack.name == scada-dnp3-fuxa

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. DNP3 Outstation 1: Substation Alpha 25 kV RTU (DNP3 Address: 10)
  # ─────────────────────────────────────────────────────────────────────────────
  dnp3-substation-alpha:
    image: python:3.11-slim
    restart: unless-stopped
    command: python3 /app/outstation_substation.py
    environment:
      - DNP3_PORT=20000
      - DNP3_ADDRESS=10
      - MASTER_ADDRESS=1
      - STATION_NAME=Substation Alpha (25 kV)
    ports:
      - "20000:20000"
    volumes:
      - /var/contenedores/scada-dnp3:/app:ro
    labels:
      - "ingress.host=substation.scada.gbnt.local"
      - "gbnt.service.name=dnp3-substation-alpha"
      - "gbnt.service.description=DNP3 RTU - Substation Alpha 25 kV (Address 10)"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      placement:
        constraints:
          - stack.name == scada-dnp3-fuxa

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. DNP3 Outstation 2: Solar PV Farm Beta 3 MW Central Inverter (DNP3 Address: 20)
  # ─────────────────────────────────────────────────────────────────────────────
  dnp3-solar-farm:
    image: python:3.11-slim
    restart: unless-stopped
    command: python3 /app/outstation_solar.py
    environment:
      - DNP3_PORT=20000
      - DNP3_ADDRESS=20
      - MASTER_ADDRESS=1
      - STATION_NAME=Solar PV Farm Beta (3 MW)
    ports:
      - "20001:20000"
    volumes:
      - /var/contenedores/scada-dnp3:/app:ro
    labels:
      - "ingress.host=solarfarm.scada.gbnt.local"
      - "gbnt.service.name=dnp3-solar-farm"
      - "gbnt.service.description=DNP3 RTU - Solar PV Farm Beta 3 MW (Address 20)"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      placement:
        constraints:
          - stack.name == scada-dnp3-fuxa

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. DNP3 Master Station & MQTT Protocol Gateway
  # ─────────────────────────────────────────────────────────────────────────────
  dnp3-master-bridge:
    image: python:3.11-slim
    restart: unless-stopped
    command: >
      sh -c "
      pip install -q paho-mqtt &&
      python3 /app/master_bridge.py
      "
    environment:
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - SUBSTATION_HOST=dnp3-substation-alpha
      - SUBSTATION_PORT=20000
      - SUBSTATION_DNP3_ADDR=10
      - SOLAR_HOST=dnp3-solar-farm
      - SOLAR_PORT=20000
      - SOLAR_DNP3_ADDR=20
      - MASTER_DNP3_ADDR=1
      - POLL_INTERVAL=1.0
    volumes:
      - /var/contenedores/scada-dnp3:/app:ro
    depends_on:
      - mqtt
      - dnp3-substation-alpha
      - dnp3-solar-farm
    labels:
      - "ingress.host=dnp3-master.scada.gbnt.local"
      - "gbnt.service.name=dnp3-master-bridge"
      - "gbnt.service.description=DNP3 Master Station & MQTT Protocol Gateway"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
      placement:
        constraints:
          - stack.name == scada-dnp3-fuxa

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. FUXA Process Visualization Web SCADA / HMI (frangoteam/FUXA)
  # ─────────────────────────────────────────────────────────────────────────────
  fuxa:
    image: frangoteam/fuxa:latest
    restart: unless-stopped
    ports:
      - "1881:1881"
    volumes:
      - /var/contenedores/scada-dnp3/fuxa-appdata:/usr/src/app/FUXA/server/_appdata
    depends_on:
      - mqtt
      - dnp3-master-bridge
    labels:
      - "ingress.host=fuxa.gbnt.local"
      - "gbnt.caddy.port=1881"
      - "gbnt.service.name=fuxa-scada"
      - "gbnt.service.description=FUXA Web SCADA Dashboard (frangoteam/FUXA)"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M
      placement:
        constraints:
          - stack.name == scada-dnp3-fuxa
          - ingress.host == fuxa.gbnt.local
          - gbnt.caddy.port == 1881
