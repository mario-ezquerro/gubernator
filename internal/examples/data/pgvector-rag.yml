version: "3.8"

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ragdb
      - POSTGRES_USER=raguser
      - POSTGRES_PASSWORD=gubernator-secret
    ports:
      - "5433:5432"
    volumes:
      - /var/contenedores/pgvector/data:/var/lib/postgresql/data
    labels:
      - "ingress.host=postgres.rag.gbnt.local"
      - "gbnt.caddy.port=5432"
      - "gbnt.service.name=pgvector-db"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
      placement:
        constraints:
          - stack.name == pgvector-rag

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /var/contenedores/qdrant/storage:/qdrant/storage
    labels:
      - "ingress.host=qdrant.rag.gbnt.local"
      - "gbnt.caddy.port=6333"
      - "gbnt.service.name=qdrant-vector"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
      placement:
        constraints:
          - stack.name == pgvector-rag

  ollama-rag:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - /var/contenedores/ollama-rag/models:/root/.ollama
    labels:
      - "ingress.host=ollama.rag.gbnt.local"
      - "gbnt.caddy.port=11435"
      - "gbnt.service.name=ollama-rag"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
      placement:
        constraints:
          - node.role == manager

  ollama-init:
    image: curlimages/curl:latest
    restart: "no"
    command: >
      sh -c "
        sleep 15 &&
        curl -sf -X POST http://ollama.rag.gbnt.local:11435/api/pull -H 'Content-Type: application/json' -d '{\"name\": \"nomic-embed-text\"}' &&
        curl -sf -X POST http://ollama.rag.gbnt.local:11435/api/pull -H 'Content-Type: application/json' -d '{\"name\": \"llama3.2\"}'
      "
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
      placement:
        constraints:
          - stack.name == pgvector-rag

  rag-ui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      - WEBUI_AUTH=False
      - OLLAMA_BASE_URL=http://ollama.rag.gbnt.local:11435
      - OLLAMA_API_BASE_URL=http://ollama.rag.gbnt.local:11435
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - RAG_OLLAMA_BASE_URL=http://ollama.rag.gbnt.local:11435
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant.rag.gbnt.local:6333
      - QDRANT_HOST=qdrant.rag.gbnt.local
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql://raguser:gubernator-secret@postgres-vector:5433/ragdb
    ports:
      - "8082:8080"
    volumes:
      - /var/contenedores/rag-ui/data:/app/backend/data
    labels:
      - "ingress.host=search.rag.gbnt.local"
      - "gbnt.caddy.port=8082"
      - "gbnt.service.name=rag-search-ui"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M
      placement:
        constraints:
          - stack.name == pgvector-rag
