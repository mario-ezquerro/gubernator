version: '3.8'

services:
  web:
    image: nginxdemos/hello:plain-text
    ports:
      - "80"
    labels:
      - "ingress.host=demo.gbnt.io"
      - "ingress.email=admin@gbnt.io"
      - "gbnt.caddy.port=80"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
