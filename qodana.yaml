####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-go

profile:
  name: qodana.recommended

include:
  - name: CheckDependencyLicenses

exclude:
  - name: All
    paths:
      - internal/web/flutter
      - site
      - vendor

# Fail the CI build if NEW critical/high severity findings are introduced
# (findings already in baseline.sarif.json are excluded automatically)
failThreshold: 0