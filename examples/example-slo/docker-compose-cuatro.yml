version: "3.8"
name: slo-orders-service

services:
  orders-api:
    image: hashicorp/http-echo:latest
    command: ["-text=Orders Service OK", "-listen=:8083"]
    ports:
      - "8083:8083"
    labels:
      gbnt.slo.enable: "true"
      gbnt.slo.target: "99.95"
      gbnt.slo.window: "30d"
      gbnt.slo.sli.error_query: 'sum(rate(caddy_http_response_status_code_total{status=~"5.."}[5m]))'
      gbnt.slo.sli.total_query: 'sum(rate(caddy_http_response_status_code_total[5m]))'
      ingress.host: "orders.gbnt.local"
      gbnt.node.role: "worker"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
