
volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:

networks:
  demo:

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: [ 'demo' ]
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres.{{stack.name}}.gbnt
    - DB_POSTGRESDB_USER=n8n_user
    - DB_POSTGRESDB_PASSWORD=n8n_password
    - DB_POSTGRESDB_DATABASE=n8n
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=supersecretkey
    - N8N_USER_MANAGEMENT_JWT_SECRET=supersecretjwt
    - OLLAMA_HOST=ollama.{{stack.name}}.gbnt:11434

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  networks: [ 'demo' ]
  restart: unless-stopped
  ports:
    - "127.0.0.1::11434"
  volumes:
    - ollama_storage:/root/.ollama
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G
      reservations:
        cpus: "0.5"
        memory: 512M
    placement:
      constraints:
        - ingress.host == ollama.gbnt.local

x-init-ollama: &init-ollama
  image: curlimages/curl:latest
  container_name: ollama-pull-llama
  command: >
    sh -c "sleep 5 && curl -X POST http://ollama.{{stack.name}}.gbnt:11434/api/pull -d '{\"name\": \"llama3.2\"}'"
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 128M
      reservations:
        cpus: "0.1"
        memory: 32M

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: [ 'demo' ]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n_user
      - POSTGRES_PASSWORD=n8n_password
      - POSTGRES_DB=n8n
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1::5678"
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
      placement:
        constraints:
          - stack.name == n8n-stack
          - ingress.host == n8n.gbnt.local

  qdrant:
    image: qdrant/qdrant
    hostname: qdrant
    container_name: qdrant
    networks: [ 'demo' ]
    restart: unless-stopped
    ports:
      - "127.0.0.1::6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      placement:
        constraints:
          - ingress.host == qdrant.gbnt.local

  ollama:
    <<: *service-ollama

  ollama-pull-llama:
    <<: *init-ollama
    depends_on:
      - ollama
