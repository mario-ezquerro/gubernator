version: "3.8"

# =============================================================================
# Gubernator (gbnt) - DeepSeek AI Inference Stack & Open-WebUI
# Universal Multi-Arch (CPU, ARM64, AMD64 & GPU) using Ollama engine
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. DeepSeek High-Performance Inference Engine (Ollama Universal Multi-Arch)
  # ─────────────────────────────────────────────────────────────────────────────
  deepseek-engine:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /var/contenedores/deepseek/models:/root/.ollama
    labels:
      - "ingress.host=api.deepseek.gbnt.local"
      - "gbnt.caddy.port=11434"
      - "gbnt.service.name=deepseek-engine"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Open-WebUI Interactive Chat Interface
  # ─────────────────────────────────────────────────────────────────────────────
  chat-ui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://api.deepseek.gbnt.local:11434
      - OPENAI_API_BASE_URL=http://api.deepseek.gbnt.local:11434/v1
      - OPENAI_API_KEY=ollama
      - WEBUI_AUTH=False
    ports:
      - "8080:8080"
    volumes:
      - /var/contenedores/open-webui/data:/app/backend/data
    labels:
      - "ingress.host=chat.deepseek.gbnt.local"
      - "gbnt.caddy.port=8080"
      - "gbnt.service.name=deepseek-chat"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.2"
          memory: 256M
