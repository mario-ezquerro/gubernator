services:
  gubernator-manager:
    build: 
      context: ../../
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data # Shared volume for SQLite, Hosts, and Caddyfile
    ports:
      - "4000:4000" # API, Telemetry, Swagger
      - "4001:4001" # Web UI
    environment:
      - GBNT_WEB_USER=admin
      - GBNT_WEB_PASSWORD=admin
    working_dir: /app/data
    command: ["/app/gbnt", "serve"]

  coredns:
    image: coredns/coredns
    volumes:
      - ./data:/data
      - ./Corefile:/Corefile
    ports:
      - "5353:53/udp" # Exposed on 5353 to avoid conflicts with Mac's mDNSResponder
    command: ["-conf", "/Corefile"]
    depends_on:
      - gubernator-manager

  caddy:
    image: caddy:alpine
    volumes:
      - ./data:/data
    ports:
      - "80:80"
    # Wait for the Caddyfile to be generated by Gubernator before starting
    command: >
      sh -c "while [ ! -f /data/Caddyfile ]; do sleep 1; done; caddy run --config /data/Caddyfile --watch"
    depends_on:
      - gubernator-manager
