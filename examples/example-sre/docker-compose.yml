services:
  gubernator-manager:
    build: 
      context: ../../
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data # Shared volume for SQLite, Hosts, and Caddyfile
    ports:
      - "4000:4000" # API Control Plane
      - "4001:4001" # Web UI
      - "4002:4002" # Telemetry, Swagger, Health
    environment:
      - GBNT_WEB=true
      - GBNT_WEB_USER=admin
      - GBNT_WEB_PASSWORD=admin
    working_dir: /app/data
    command: ["/app/gbnt", "serve"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  coredns:
    image: coredns/coredns
    volumes:
      - ./data:/data
      - ./Corefile:/Corefile
    ports:
      - "5353:53/udp" # Exposed on 5353 to avoid conflicts with Mac's mDNSResponder
    command: ["-conf", "/Corefile"]
    depends_on:
      - gubernator-manager
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

  caddy:
    image: caddy:alpine
    volumes:
      - ./data:/data
    ports:
      - "80:80"
    # Wait for the Caddyfile to be generated by Gubernator before starting
    command: >
      sh -c "while [ ! -f /data/Caddyfile ]; do sleep 1; done; caddy run --config /data/Caddyfile --watch"
    depends_on:
      - gubernator-manager
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
