services:
  whoami:
    image: traefik/whoami
    labels:
      - "ingress.host=whoami.gubernator.local"
      - "gbnt.caddy.port=80"
      - "gbnt.node.role=worker"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
