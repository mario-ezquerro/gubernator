global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'gubernator-local'

# Alerting (optional, configure alertmanager if needed)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # Gubernator telemetry — port 4002 is public (no auth required)
  - job_name: 'gubernator'
    scrape_interval: 15s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gubernator:4002']
        labels:
          service: 'gubernator'
          environment: 'local'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
