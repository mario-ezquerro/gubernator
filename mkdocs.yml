site_name: Gubernator Orchestrator
site_description: A lightweight, hybrid container orchestrator built in Go — simplicity of Swarm, flexibility of Nomad.
site_author: Mario Ezquerro
repo_url: https://github.com/mario-ezquerro/gubernator
repo_name: mario-ezquerro/gubernator

theme:
  name: material
  logo: gubernator-icon.png
  favicon: gubernator-icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - Installation: install.md
  - Multi-Host Clustering: cluster.md
  - CLI Reference:
    - Overview: cli.md
    - Full Command Reference: cli-full.md
  - Architecture: architecture.md
  - API & SDK: api.md
  - Docker Compose Reference: compose.md
  - Web UI Dashboard: web-ui.md
  - Observability:
    - Health & Metrics: observability.md
  - Examples:
    - Overview: examples.md
    - "WordPress": example-wordpress.md
    - "SRE Observability": example-sre.md
    - "Distributed Tracing (Jaeger)": example-jaeger.md
    - "Jaeger Integration Guide": how-use-jaeger.md
    - "AI & Automation (n8n)": example-n8n.md
    - "AI Development (Jupyter)": example-jupyter.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
