name: Tests & Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Vet (Static Analysis)
        run: go vet ./...

      - name: Run Tests (with Race Detector)
        run: go test -v -race ./...

      - name: Build Verification
        run: go build -v ./cmd/gbnt

