name: Qodana

on:
  push:
    branches:
      - main
      - 'releases/*'
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  qodana:
    name: Qodana Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan (first run)
        if: ${{ hashFiles('baseline.sarif.json') == '' }}
        uses: JetBrains/qodana-action@v2026.1
        with:
          upload-result: true
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2133200645 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

      - name: Qodana Scan (with baseline)
        if: ${{ hashFiles('baseline.sarif.json') != '' }}
        uses: JetBrains/qodana-action@v2026.1
        with:
          args: >-
            --baseline,baseline.sarif.json
          upload-result: true
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2133200645 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'

      - name: Upload SARIF to GitHub Security
        if: ${{ success() && hashFiles(format('{0}/qodana/results/qodana.sarif.json', runner.temp)) != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana